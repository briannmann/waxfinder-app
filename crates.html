<style>

   tools/ref/crates.before-square-tiles-2026-11-08.html). */

<script id="wf-analysis-controller">
/* Inline so Crates never depends on a separately cached/blocked popup script. */
(function () {
  const box=document.getElementById('wf-anl'),btn=document.getElementById('wf-anl-action');
  const details=document.getElementById('wf-anl-details'),current=document.getElementById('wf-anl-current'),updated=document.getElementById('wf-anl-updated');
  let timer=0,checking=false,ready=false,wasBusy=false,lastUpdate='';
  /* Dismiss: hidden until there are MORE tracks to analyse than when it was dismissed (new downloads), so it never nags about the same pile */
  /* Click the pill to open the status panel (like the Files pill); click outside or press Escape to close. Inside the open panel
     the big button starts the analysis. */
  const closePanel=()=>{if(!box.classList.contains('exp'))return;box.classList.remove('exp');applyDismiss()};
  document.addEventListener('pointerdown',e=>{if(box.classList.contains('exp')&&!box.contains(e.target))closePanel()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  const DKEY='wf-anl-dismissed';let lastTracks=0;
  const dismissedAt=()=>{try{const v=localStorage.getItem(DKEY);return v===null?null:Number(v)}catch(e){return null}};
  let idle=false;const xb=document.getElementById('wf-anl-x');const applyDismiss=()=>{const at=dismissedAt(),open=box.classList.contains('exp');box.hidden=xb.hidden=!open&&(idle||(at!==null&&lastTracks<=at))};
  xb.addEventListener('click',e=>{e.stopPropagation();try{localStorage.setItem(DKEY,String(lastTracks))}catch(x){}box.hidden=xb.hidden=true});
  const stages=[['analysis','BPM, key & energy'],['sound','Sound matching'],['waves','Waveforms'],['genres','Genre tags'],['artists','Artist names']];
  function retry(message) {
    ready=false;btn.disabled=false;btn.classList.remove('busy');btn.textContent='Retry status';
    updated.textContent=message+(lastUpdate?' Last updated '+lastUpdate+'.':'');
    clearTimeout(timer);timer=setTimeout(check,15000);
  }
  async function request(url,method,body) {
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
    try {const r=await fetch(url,{method:method||'GET',cache:'no-store',signal:controller.signal,...(body?{headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{})});
      if(!r.ok)throw new Error('Request failed');return await r.json();
    } finally {clearTimeout(timeout)}
  }
  function draw(d) {
    if(!d.jobs||!d.need||typeof d.busy!=='boolean'||typeof d.tracks!=='number')throw new Error('Invalid status');
    const jobs=d.jobs,active=stages.map(([k])=>jobs[k]||{}).filter(j=>j.state==='working'||j.busy);
    const primary=active[0]||{},done=Number(primary.done)||0,total=Number(primary.total)||0;
    const genreWait=jobs.genres?.state==='paused'&&jobs.genres.retry_at>Date.now()/1000;
    const onlyGenreWait=genreWait&&!d.need.analysis&&!d.need.sound&&!d.need.waves;
    btn.classList.toggle('busy',d.busy);btn.disabled=d.busy||!d.tracks||onlyGenreWait;
    btn.style.setProperty('--p',total?Math.min(1,done/total):0);
    btn.textContent=d.busy?('Analysing '+(total?done+' of '+total+' · '+Math.round(done/total*100)+'%':'tracks…')):d.tracks?'Analyse '+d.tracks+' tracks':'Tracks analysed';
    if(!d.busy&&onlyGenreWait)btn.textContent='Genre lookup paused';
    details.replaceChildren(...stages.map(([key,label])=>{
      const j=jobs[key]||{},remaining=Number(d.need[key])||0,working=j.state==='working'||j.busy;
      let text=working?(j.total?j.done+' of '+j.total:'Working…'):remaining?remaining+(j.state==='paused'?' waiting':' remaining'):'Up to date';
      if(j.errors)text+=' · '+j.errors+' failed';
      if(j.error&&j.state!=='paused')text+=(key==='genres'?' · lookup interrupted':' · error');
      else if(j.state==='paused')text+=' · paused';
      const row=document.createElement('div'),name=document.createElement('b'),value=document.createElement('span');
      name.textContent=label;
      const mk=(t,fn)=>{const b=document.createElement('button');b.type='button';b.className='wf-anl-do';b.textContent=t;b.onclick=fn;return b};
      if(!working&&remaining&&!d.busy&&!(key==='genres'&&genreWait)) value.append(mk(text,async e=>{e.stopPropagation();e.target.disabled=true;e.target.textContent='Starting…';try{await request('/library/analyse','POST',{only:key});await check()}catch(x){retry('Could not start that check.')}}));
      else value.textContent=text;
      if(key==='artists'&&!working&&d.review){const go=mk(d.review+' to review',()=>{location.href='/clean#artists'});if(value.firstChild)value.prepend(go,' · ');else{value.textContent='';value.append(go)}}
      row.append(name,value);return row;
    }));
    current.textContent=primary.current?'Current: '+primary.current:'';
    lastUpdate=new Date().toLocaleTimeString();updated.textContent='Updated '+lastUpdate;
    const genreError=jobs.genres?.error||'';
    if(/browser (?:failed|could not launch|could not start)/i.test(genreError))updated.textContent+=' · The Traxsource search browser could not start.';
    else if(/browser returned no page/i.test(genreError))updated.textContent+=' · The Traxsource search browser returned no results page.';
    else if(/its search window/i.test(genreError))updated.textContent+=' · Finish verification in the separate Traxsource Chrome window; lookup will resume.';
    else if(/browser (?:check|verification)/i.test(genreError))updated.textContent+=' · Traxsource needs browser verification.';
    else if(/timed out/i.test(genreError))updated.textContent+=' · A genre search timed out.';
    if(genreWait)updated.textContent+=' · Automatically retries at '+new Date(jobs.genres.retry_at*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'.';
    if(jobs.genres?.query_rejected)updated.textContent+=' · '+jobs.genres.query_rejected+' tracks have rejected search text and need checking.';
    ready=true;lastTracks=d.tracks;idle=!d.busy&&!d.tracks&&!onlyGenreWait;applyDismiss();
    window.__wfAnlLast={tracks:d.tracks,busy:d.busy,done,total,paused:!d.busy&&!!onlyGenreWait};document.dispatchEvent(new CustomEvent('wf-anl-status',{detail:window.__wfAnlLast}));
    if(wasBusy&&!d.busy)document.dispatchEvent(new CustomEvent('wf-analysed'));
    wasBusy=d.busy;
  }
  async function check() {
    if(checking)return;checking=true;clearTimeout(timer);
    try {const d=await request('/library/pending');draw(d);timer=setTimeout(check,d.busy?2500:15000)}
    catch(e){retry('Cannot refresh analysis status.')}
    finally {checking=false}
  }
  async function start(){
    if(!ready){btn.disabled=true;btn.textContent='Refreshing status…';await check();return}
    clearTimeout(timer);btn.disabled=true;btn.textContent='Starting analysis…';
    try {await request('/library/analyse','POST');await check()}
    catch(e){retry('Could not confirm analysis started.')}
  }
  btn.addEventListener('click',()=>{if(!box.classList.contains('exp')){box.classList.add('exp');return}start()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  window.wfAnalyse={check,start,show:()=>{try{localStorage.removeItem(DKEY)}catch(e){}box.hidden=false;box.classList.add('exp');check()}}; /* show: bring the corner panel back (open) after it was dismissed */check();
})();
</script>
<script>
/* Crates: browse, open (vinyls fly out into cards via /static/crates3d.js), remove tracks, build a set from one. */
const $=id=>document.getElementById(id);
const el=(t,p,...k)=>{const e=document.createElement(t);Object.assign(e,p||{});k.forEach(c=>c!=null&&e.append(c));return e};

  $('ctundo').hidden=!undo;$('ctundo').onclick=async()=>{T.hidden=true;clearTimeout(toastT);await undo()};toastT=setTimeout(()=>T.hidden=true,ms||7000)}
/* XML fallback: a crate as a Rekordbox XML + M3U8 (also what the Windows PC uses, where the CDJ export tool isn't installed) */
let exporting=false;
async function exportXml(arg){const ids=(Array.isArray(arg)?arg:[arg]).filter(id=>data.crates.find(x=>x.id===id));if(!ids.length||exporting)return;exporting=true;
  const b=$('oexport'),t=b.textContent;b.disabled=true;b.textContent='Exporting…';
  try{let n=0,tr=0,off=0,last=null;const bad=[];   // one XML + M3U8 per crate, every crate you ticked
    for(const id of ids){const nm=data.crates.find(x=>x.id===id).name;
      const r=await fetch('/crates/export',{method:'POST',body:JSON.stringify({crate:id})}).then(r=>r.json());
      if(r.error)bad.push(nm+': '+r.error);else{n++;tr+=r.count;off+=r.offline||0;last=r}}
    if(!n)ctoast('Could not export: '+bad.join('; '),null,9000);
    else ctoast('Exported '+(n===1?'':n+' crates, ')+tr+(tr===1?' track':' tracks')+' — '+last.xml.split('/').slice(-3).join('/').replace(/[^/]*$/,n>1?'(one file per crate)':last.xml.split('/').pop())+(last.usb?' (on your stick)':' (on this laptop)')
      +(off?' · '+off+' tracks offline right now (listed by path)':'')+(bad.length?' · NOT exported: '+bad.join('; '):'')+'. In Rekordbox: File → Import → Import Collection, then drag the playlist in.',null,14000)}
  catch(e){ctoast('Could not export: the server did not answer',null,9000)}
  b.disabled=false;b.textContent=t;exporting=false}
/* CDJ export: picked crates -> a Pioneer-ready stick (no Rekordbox). Dialog = stick picker + crate checklist + live progress. */
let cdjInfo=null;const cdjGet=async()=>{try{cdjInfo=await fetch('/cdj/info').then(r=>r.json())}catch(e){cdjInfo={available:false,sticks:[]}}return cdjInfo};
const gb=n=>n>=2**30?(n/2**30).toFixed(1)+' GB':Math.round(n/2**20)+' MB';
let cdjPoll=0;
function cdjClose(){$('cdj').hidden=true;$('cdjscrim').hidden=true;clearTimeout(cdjPoll)}
$('cdjx').onclick=cdjClose;$('cdjscrim').onclick=cdjClose;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('cdj').hidden){e.stopPropagation();cdjClose()}},true);
async function exportCrate(id,more){const info=await cdjGet();if(!info.available){if(id)return exportXml(id);ctoast('The CDJ export is only set up on the Mac. Right-click a crate for the Rekordbox XML file instead.',null,9000);return}
  $('cdj').hidden=false;$('cdjscrim').hidden=false;drawCdj(info,new Set(more||[id]),null)}
async function drawCdj(info,pick,vol,confirm){const B=$('cdjbody');window.cdjAside=false;
  const sticks=info.sticks;if(!vol||!sticks.some(s=>s.name===vol))vol=(sticks.find(s=>s.ours)||sticks.find(s=>!s.rekordbox)||sticks[0]||{}).name||null;
  const st=sticks.find(s=>s.name===vol);
  const sl=sticks.length?sticks.map(s=>{const r=el('input',{type:'radio',name:'cdjstick',checked:s.name===vol});r.onchange=()=>drawCdj(info,pick,s.name,false);
      return el('label',{className:'opt'},r,el('span',{className:'nm',textContent:s.name}),
        el('small',{textContent:s.fs+' · '+gb(s.free)+' free'}))}):[el('p',{className:'note',textContent:'No USB found. Plug one in, then press Refresh.'})];
  const cl=data.crates.map(c=>{const k=el('input',{type:'checkbox',checked:pick.has(c.id)});k.onchange=()=>{k.checked?pick.add(c.id):pick.delete(c.id);upd()};
    return el('label',{className:'opt'},k,el('span',{className:'nm',textContent:c.name}),el('small',{textContent:c.tracks.length+(c.tracks.length===1?' track':' tracks')}))});
  const boxes=()=>[...document.querySelectorAll('#cdjbody .clist .opt')];
  const fq=el('input',{type:'search',placeholder:'Filter crates',ariaLabel:'Filter crates',autocomplete:'off'});
  fq.oninput=()=>{const q=fq.value.trim().toLowerCase();boxes().forEach(l=>{l.hidden=!!q&&!l.querySelector('.nm').textContent.toLowerCase().includes(q)})};
  const setAll=on=>{boxes().filter(l=>!l.hidden).forEach(l=>{const k=l.querySelector('input'),c=data.crates[boxes().indexOf(l)];if(k.checked!==on){k.checked=on;on?pick.add(c.id):pick.delete(c.id)}});upd()};
  const all=el('button',{type:'button',className:'linkb',textContent:'Select all',onclick:()=>setAll(true)}),none=el('button',{type:'button',className:'linkb',textContent:'None',onclick:()=>setAll(false)});
  const warn=null;
  const go=el('button',{type:'button',className:'go',textContent:'Export'}),ref=el('button',{type:'button',className:'ghost',textContent:'Refresh USB'}),xml=el('button',{type:'button',className:'linkb',textContent:'Rekordbox XML file instead'});
  const out=el('div');
  const pv=el('p',{className:'note'});let pvT=0;
  const showPv=()=>{clearTimeout(pvT);if(!st||!pick.size){pv.textContent='';return}pvT=setTimeout(async()=>{try{const r=await fetch('/cdj/preview?volume='+encodeURIComponent(vol)+'&crates='+[...pick].join(',')).then(r=>r.json());
    pv.textContent=r.already?(r.new?'Only '+r.new+' new song'+(r.new===1?'':'s')+' will be copied'+(r.copy_mb?' (about '+r.copy_mb+' MB)':'')+'; '+r.already+' already on the stick.':'Nothing new: all '+r.already+' songs are already on the stick.'):r.new+' song'+(r.new===1?'':'s')+' will be added'+(r.copy_mb?' (about '+r.copy_mb+' MB to copy)':'')+'.'}catch(e){pv.textContent=''}},250)};
  const upd=()=>{showPv();go.disabled=!(st&&pick.size&&(!warn||confirm));const h=document.getElementById('cdjcount');if(h)h.textContent='2 · Export Crates ('+pick.size+')'};
  ref.onclick=async()=>{await cdjGet();drawCdj(cdjInfo,pick,vol,confirm)};
  xml.onclick=()=>{const ids=[...pick];if(ids.length){cdjClose();exportXml(ids)}};
  go.onclick=async()=>{go.disabled=true;ref.disabled=true;
    const r=await fetch('/crates/cdj',{method:'POST',body:JSON.stringify({crates:[...pick],volume:vol,confirm:!!window.cdjAside})}).then(r=>r.json());
    if(r.needs_confirm){window.cdjAside=true;out.replaceChildren(el('div',{className:'bad',textContent:'This stick still has an old Rekordbox library on it. Waxfinder can\'t merge with it, so it will be renamed and kept on the stick (nothing is deleted) and a fresh Waxfinder library built. Press Export again to go ahead.'}));go.disabled=false;ref.disabled=false;return}
    window.cdjAside=false;
    if(r.error){out.replaceChildren(el('div',{className:'bad',textContent:r.error}));go.disabled=false;ref.disabled=false;return}
    if(window.parent!==window){cdjClose();parent.postMessage({wfCdj:'poll'},'*');return}   // inside the shell: the progress pill above the player takes over, so you can carry on working
    watchCdj(r.id,out)};
  B.replaceChildren(el('div',{},el('h3',{textContent:'1 · Choose USB'}),...sl),el('div',{},el('h3',{id:'cdjcount',textContent:'2 · Export Crates ('+pick.size+')'}),el('div',{className:'cfilt'},fq,all,none),el('div',{className:'clist'},...cl)),
    el('p',{className:'note',textContent:'Music already on the chosen stick stays where it is; anything else is copied onto it. Earlier crates on the stick are kept. Waveforms, beat grid and key are worked out by the exporter, so they can differ from Waxfinder\'s own numbers. Not yet tried on a real CDJ — bring your normal stick to the first gig.'}),
    pv,el('div',{className:'acts'},go,ref,el('span',{className:'sp'}),xml),out);
  upd()}
/*wfdev-open*/(()=>{const q=new URLSearchParams(location.search).get("export");if(q)setTimeout(()=>{try{exportCrate(null,[])}catch(e){}},700)})();
function watchCdj(id,out){const bar=el('i'),line=el('div',{textContent:'Starting…'});out.replaceChildren(line,el('div',{className:'prog'},bar));
  const tick=async()=>{let j;try{j=await fetch('/cdj/job?id='+id).then(r=>r.json())}catch(e){cdjPoll=setTimeout(tick,1500);return}
    if(j.state==='running'){line.textContent=(j.stage||'Working')+(j.total?' ('+j.done+' of '+j.total+')':'')+'…';bar.style.transform='scaleX('+(j.total?Math.min(1,j.done/j.total):0)+')';cdjPoll=setTimeout(tick,900);return}
    if(j.state==='error'){out.replaceChildren(el('div',{className:'bad',textContent:(j.outcome==='verify_failed'?'Written, but not verified: ':'Export failed: ')+(j.error||'unknown error')+(j.backup?' (the stick\'s previous library is in '+j.backup.split('/').pop()+')':'')}));return}
    const r=j.report||{},w=(r.warnings||[]).length,lo=j.left_out||[];
    const box=el('div',{className:'done'},'Done: '+(r.new_files==null?'Exported to':r.new_files===0?'No new tracks to copy; playlists updated on':'Copied '+r.new_files+(r.new_files===1?' new track':' new tracks')+' to')+' '+j.stick+'. The stick now has '+r.tracks+' tracks in '+r.playlists+' playlists. '+(j.outcome==='verified'?'Checked OK.':j.outcome==='omissions'?'Passed its check, but some tracks were left out.':'The check result was not recorded.')+(r.bytes_copied?' Copied '+gb(r.bytes_copied)+'.':' Nothing needed copying.')
      +(w?' '+w+' warnings.':'')+(j.backup?' A copy of the old library is in '+j.backup.split('/').pop()+'.':'')+' Eject the stick in Finder before pulling it out.');
    if(lo.length){const d=el('details',{className:'leftout'},el('summary',{textContent:lo.length+(lo.length===1?' track was':' tracks were')+' left out — click to see which'}),
      el('ul',{},...lo.map(x=>el('li',{},el('b',{textContent:x.title}),el('span',{textContent:(x.crate?'in '+x.crate+' · ':'')+x.why})))));box.append(d)}
    if((r.changes||[]).length){const n=x=>x+(x===1?' track':' tracks');box.append(el('ul',{className:'chg'},...r.changes.map(c=>el('li',{textContent:c.first?c.name+': new playlist, '+n(c.count):c.name+': '+([c.added?n(c.added)+' added':'',c.removed?n(c.removed)+' removed':'',c.moved?'order changed':''].filter(Boolean).join(', ')||'no changes')}))))}
    out.replaceChildren(box);
    load()};
  tick()}
setTimeout(()=>cdjGet(),4000);   // opening /crates starts the background listening for CDJ export
window.WaxCrateExport=exportCrate;window.WaxCrateExportMany=ids=>exportCrate(null,ids||[]);
$('oexport').onclick=()=>{if(cur)exportCrate(cur)};
/* right-click menu on a crate (3D crates, and the Library rail via window.WaxCrateMenu) */
function crateMenu(id,e,canOpen){const old=document.getElementById('cmenu');if(old)old.remove();
  const m=el('div',{id:'cmenu',className:'cmenu glass',role:'menu'});
  const item=(label,fn)=>{const b=el('button',{type:'button',role:'menuitem',textContent:label});b.onclick=()=>{m.remove();fn()};return b};
  if(canOpen)m.append(item('Open',()=>openCrate(id)));
  m.append(item('Export to CDJ stick…',()=>exportCrate(id)));
  const cr=data.crates.find(x=>x.id===id),nm=cr?cr.name:'this crate',del=el('button',{type:'button',role:'menuitem',className:'danger',textContent:'Delete crate…'});
  del.onclick=async ev=>{if(del.dataset.sure!=='1'){ev.stopPropagation();del.dataset.sure='1';del.textContent='Sure? Delete “'+(nm.length>22?nm.slice(0,21)+'…':nm)+'”';return}   // second click deletes; tracks stay in your library
    m.remove();await post('/crates/edit',{crate:id,delete:true});if(cur===id)closeCrate();load()};
  m.append(el('hr'),del);
  document.body.append(m);const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(e.clientX,innerWidth-w-8))+'px';m.style.top=Math.max(8,Math.min(e.clientY,innerHeight-h-8))+'px';
  m.querySelector('button').focus({preventScroll:true});
  const away=ev=>{if(ev.type==='keydown'&&ev.key!=='Escape')return;if(ev.type==='pointerdown'&&m.contains(ev.target))return;m.remove();cleanup()};
  const cleanup=()=>{document.removeEventListener('pointerdown',away,true);document.removeEventListener('keydown',away,true);removeEventListener('scroll',away,true);removeEventListener('resize',away)};
  setTimeout(()=>{document.addEventListener('pointerdown',away,true);document.addEventListener('keydown',away,true);addEventListener('scroll',away,true);addEventListener('resize',away)});
  m.addEventListener('click',cleanup)}
window.WaxCrateMenu=crateMenu;
$('cmpclose').onclick=closeCmp;
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||$('cmp').hidden||/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  const any=[...cmpSel.values()].some(s=>s.size);if(any){cmpSel.forEach(s=>s.clear());drawCmp()}else closeCmp()});

document.addEventListener('wf-analysed',()=>load());   // a run just finished: 'Not analysed yet' becomes BPM/key/energy
{let first=null,loaded=false;try{first=JSON.parse(localStorage.getItem('wf.cratesCache')||'null')}catch(e){}   // last visit's crate list: the boxes draw from it at once, the live list then updates them
const freshP=load().then(()=>{loaded=true});
(async()=>{
  if(first&&Array.isArray(first.crates)){if(!loaded)data=first}else await freshP;
  try{let m=await window.wfScene3d;
    if(m instanceof Error||!m||!m.mountCrates){   // the module failed to load (a dropped request): one clean reload gets a fresh module map, then give up to the flat list
      let again=false;try{again=sessionStorage.getItem('wf.c3retry')!=='1';if(again)sessionStorage.setItem('wf.c3retry','1')}catch(e){}
      if(again){location.reload();return}throw m}
    try{sessionStorage.removeItem('wf.c3retry')}catch(e){}
    const {mountCrates}=m;
    const st=$('stage');st.classList.remove('flat');st.replaceChildren();
    scene=mountCrates(st,{crates:shown(),onOpen:openCrate,onReorder:saveOrder,onContext:(id,e)=>crateMenu(id,e,true),mode:cmode});setCMode(cmode);
  }catch(e){console.warn(e);scene3dFailed=true;await freshP;drawFlat()}
})()}
