name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy yt-dlp imageio-ffmpeg mutagen certifi pyinstaller pillow pywebview
          pip install pyrekordbox || echo "pyrekordbox not installed (optional)"
      - name: Build app folder
        run: pyinstaller waxfinder.spec --noconfirm
      - name: Build installer
        shell: pwsh
        env:
          WF_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          $env:WF_VERSION = $env:WF_VERSION.TrimStart("v")
          & $iscc installer\waxfinder.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test the installed copy
        shell: pwsh
        run: |
          $setup = Resolve-Path out\Waxfinder-Setup.exe
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Waxfinder\Waxfinder.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          Start-Process $exe
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/discover/status -UseBasicParsing -TimeoutSec 3; $ok = ($r.StatusCode -eq 200) } catch {}
          }
          Start-Sleep 20   # let the background start-up threads run
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Waxfinder\_internal"
          $bad = $false
          foreach ($n in "server.log", "swallowed.log") {
            $f = Join-Path $dir $n
            if (Test-Path $f) { Write-Host "---- $n ----"; Get-Content $f -Tail 80; if ((Get-Content $f -Raw) -match "Traceback") { $bad = $true } } else { Write-Host "(no $n)" }
          }
          Write-Host "---- data files written ----"; Get-ChildItem $dir -Filter *.json | Select-Object -ExpandProperty Name
          if (-not $ok) { throw "Waxfinder did not answer on :8765 within 90 s" }
          if ($bad) { throw "Traceback found in the logs" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "home page failed" }
          Write-Host "Smoke test passed"
      - uses: actions/upload-artifact@v4
        with: { name: Waxfinder-Setup, path: out/Waxfinder-Setup.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/Waxfinder-Setup.exe }
