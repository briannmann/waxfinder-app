<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waxfinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%236a3bff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c6ff3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* The shell: every page runs in this frame so the player (static/player.js) keeps playing between pages.
   The address bar and tab title follow the page inside. app.py serves this for top-level visits only (Sec-Fetch-Dest). */
html,body{margin:0;height:100%;background:#0b0722;overflow:hidden}
#page{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--wxp-h,0px));border:0;display:block;background:#0b0722;transition:height .35s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#page{transition:none}}
</style>
</head><body>
<iframe id="page" title="Waxfinder" allow="autoplay; fullscreen; clipboard-write"></iframe>
<script src="/static/player.js"></script>
<script src="/static/exportpill.js?v=7"></script>
<script src="/static/devices.js?v=7"></script>
<script>
(function () {
  const f = document.getElementById('page');
  /* did the user reload (F5 / hard refresh) this tab? The page inside the frame is always a fresh navigation, so it asks us (library.js):
     true only for the first page loaded after the reload */
  window.__wfReload = (performance.getEntriesByType('navigation')[0] || {}).type === 'reload';
  f.addEventListener('load', () => { window.__wfReload = false }, { once: true });
  f.src = location.pathname + location.search + location.hash;
  let last = '';
  function sync() {   // address bar + tab title follow the page in the frame (links, hash jumps, pushState)
    try {
      const w = f.contentWindow, href = w.location.href, title = w.document.title;
      if (!href || href === 'about:blank') return;
      if (href !== last) { last = href; if (href !== location.href) history.replaceState(null, '', href) }
      if (title && document.title !== title) document.title = title;
    } catch (e) { }
  }
  f.addEventListener('load', () => {
    sync();
    try {
      const w = f.contentWindow;
      w.addEventListener('hashchange', sync); w.addEventListener('popstate', sync);
      w.focus();   // arrow keys / space scroll the page straight away
    } catch (e) { }
  });
  setInterval(sync, 700);
  // a file dropped on the player bar must not make the browser open it (pages handle their own drops)
  addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
})();
</script>
</body></html>
